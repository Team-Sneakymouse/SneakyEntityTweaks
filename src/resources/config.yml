# Fishing rods that fly a kite when cast. Only rods listed here turn into a kite.
# Each key is the rod's magic-item id (magicspells:magicitem). A rod matches when
# that id matches, else when its item_model equals rod-model, else (old copies
# that predate the item_model cutover) when its integer custom model data equals legacy-cmd.
# kite-model is the item_model of the clay_ball the kite (an invisible allay) holds.
kites:
  toy-kite-red:
    rod-model: "lom:legacy/fishing_rod/33"
    legacy-cmd: 33
    kite-model: "lom:entities/kites/kite_old"
